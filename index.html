function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function unlock(pw){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"])
   .then(function(km){return crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b64(SALT),iterations:ITERS,hash:"SHA-256"},
      km,{name:"AES-GCM",length:256},false,["decrypt"])})
   .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT))})
   .then(function(pt){return new TextDecoder().decode(pt)});
}
function show(html){document.open();document.write(html);document.close()}
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();
  var pw=document.getElementById("p").value,e=document.getElementById("e"),b=document.getElementById("b");
  e.textContent="";b.disabled=true;b.textContent="Decrypting\u2026";
  unlock(pw).then(function(html){
    try{sessionStorage.setItem("dashpw",pw)}catch(_){}
    show(html);
  }).catch(function(){
    e.textContent="Wrong passphrase.";b.disabled=false;b.textContent="Unlock";
  });
});
// Re-unlock silently within the same tab so an hourly refresh does not re-prompt.
// sessionStorage dies with the tab; it is never written to disk by us.
(function(){
  var s=null;try{s=sessionStorage.getItem("dashpw")}catch(_){}
  if(!s)return;
  unlock(s).then(show).catch(function(){try{sessionStorage.removeItem("dashpw")}catch(_){}});
})();
