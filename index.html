    var u=location.pathname+"?t="+Date.now();
    location.replace(u);
  }
  function tick(){
    if(document.hidden)return;
    if(Date.now()-last>=PERIOD)refresh();
  }
  setInterval(tick,60*1000);
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden)tick();
  });
})();
</script>
</body></html>
